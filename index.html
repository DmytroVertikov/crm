  --accent:#6fb7c9; --accent-ink:#0c1a20; --accent-soft:#1d3640;
  --crit:#ff8c84; --crit-soft:#3a1f1d;
  --warn:#f0c36a; --warn-soft:#3a2f14;
  --good:#7fcf98; --good-soft:#1b3324;
  --info:#9ab6dc; --info-soft:#202c3d;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;background:var(--surface)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em}
.top{flex-wrap:wrap}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.stat{font-size:12.5px;color:var(--muted);margin-right:4px}
.stat.bad{color:var(--crit)}
.demo[hidden]{display:none}
.demo{font-size:12.5px;background:var(--warn-soft);color:var(--warn);padding:3px 10px;border-radius:999px;font-weight:600}
.body{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 300px}
.body.noright{grid-template-columns:340px minmax(0,1fr)}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.lt{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;color:var(--muted)}

.list{flex:1;overflow-y:auto}
.newrow{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--accent-soft)}
.newrow small{display:block;color:var(--muted);margin-top:4px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer}
.item:hover{background:var(--sel)}
.item.active{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.r1{display:flex;justify-content:space-between;gap:8px}
.nm{font-weight:600}
.dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.r2{color:var(--muted);font-size:13.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;font-size:12.5px}
.step-t{font-weight:600}
.step-t.crit{color:var(--crit)} .step-t.warn{color:var(--warn)} .step-t.none{color:var(--warn)} .step-t.ok{color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}

.center{display:flex;flex-direction:column;min-height:0;min-width:0}

.next input{flex:1 1 220px}

.step.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.now .dot{border-color:var(--accent);background:var(--accent-soft)}
.step b{display:block;font-size:14.5px}
.small-t{color:var(--muted);font-size:13px}
.inline{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:flex-end}

.g2 .inl{border-color:var(--line2)}
.lower{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start;margin-bottom:6px}
.lower-panel{min-width:0}.lower-panel h3.sec{margin-top:0}

.actions{display:flex;flex-wrap:wrap;gap:6px}
.composer{display:flex;gap:10px;padding:12px 24px;border-top:1px solid var(--line);background:var(--surface)}

.tile span{color:var(--muted);font-size:13px}

.tile.warn{border-left-color:var(--warn)} .tile.warn b{color:var(--warn)}
.tile.info{border-left-color:var(--info)} .tile.good{border-left-color:var(--good)}
.note{border-left:4px solid var(--line)}
.note.crit{border-left-color:var(--crit)} .note.warn{border-left-color:var(--warn)} .note.info{border-left-color:var(--info)}
.note.done{opacity:.55}
.note h5{margin:0 0 2px;font-size:14.5px}
.empty{padding:24px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
@media (max-width:1100px){.body,.body.noright{grid-template-columns:300px minmax(0,1fr)}.right{display:none}.tiles{grid-template-columns:repeat(2,1fr)}}

  html,body{height:auto}.app{height:auto}
  .body,.body.noright{display:block}
  .left{border-right:0;border-bottom:1px solid var(--line)}.list{max-height:320px}
  .right{display:block;border-left:0;border-top:1px solid var(--line)}
  .scroll{padding:16px}.composer{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

    return fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:opt.prefer||'return=minimal'},
      body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
        if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t);});
        return opt.method&&opt.method!=='GET'?null:r.json();});
  }
  function toRows(c){
    var cl={id:c.id,num:c.num,name:c.name,phone:c.phone||null,email:null,permit_expiry:c.expiry||null,next_step:c.next||'',situacion:c.situ||null,tipo_autorizacion:c.tipo||null,estado_expediente:c.estado||null,tipo_documento:c.doc||null,otro_documento:c.otroDoc||null,goal:c.goal||'',next_note:c.nextNote||'',nationality:c.nat||null,nie:c.nie||null,extra_phones:c.phones2.filter(Boolean)};
    var k=c.cs?{client_id:c.id,type:c.cs.type,filed:c.cs.filed,req_received:c.cs.reqRecv||null,req_due:c.cs.reqDue||null,
      answered:c.cs.answered||null,result_text:c.cs.result?c.cs.result.text:null,result_date:c.cs.result?c.cs.result.date:null}:null;
    var n=c.notes.map(function(x){return {client_id:c.id,kind:x.t,text:x.text,date:x.date};});
    return {cl:cl,k:k,n:n};
  }
  function fromRemote(cl,ks,ns){
    var out=cl.map(function(r){
      var k=ks.filter(function(z){return z.client_id===r.id;})[0];
      return {id:r.id,num:r.num,name:r.name,phone:r.phone||'',expiry:r.permit_expiry,next:r.next_step||'',draft:'',situ:r.situacion||'',tipo:r.tipo_autorizacion||'',estado:r.estado_expediente||'',doc:r.tipo_documento||'',otroDoc:r.otro_documento||'',goal:r.goal||'',nextNote:r.next_note||'',nat:r.nationality||'',nie:r.nie||'',phones2:r.extra_phones||[],
        cs:k?{type:k.type,filed:k.filed,reqRecv:k.req_received,reqDue:k.req_due,answered:k.answered,
          result:k.result_text?{text:k.result_text,date:k.result_date}:null}:null,
        notes:ns.filter(function(z){return z.client_id===r.id;}).sort(function(a,b){return a.id-b.id;})
          .map(function(z){return {t:z.kind,text:z.text,date:z.date};})};
    });
    return out;
  }
  function remoteLoad(){
    return Promise.all([sb('clients?select=*&order=id'),sb('cases?select=*&order=id'),sb('notes?select=*&order=id')]).then(function(a){
      clients=fromRemote(a[0],a[1],a[2]);
      nextId=clients.reduce(function(m,c){return Math.max(m,c.id+1);},1);
      nextNum=clients.reduce(function(m,c){return Math.max(m,c.num+1);},1001);
      remote.last={};clients.forEach(function(c){remote.last[c.id]=JSON.stringify(toRows(c));});
      remote.loaded=true;remote.state='ok';
    });
  }
  function remotePush(){
    if(!remote.loaded)return;
    if(remote.busy){remote.again=true;return;}
    remote.busy=true;remote.again=false;
    var seen={},jobs=[];
    clients.forEach(function(c){
      seen[c.id]=1;var rows=toRows(c),sig=JSON.stringify(rows);
      if(remote.last[c.id]===sig)return;
      jobs.push(function(){
        return sb('clients',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:[rows.cl]})
          .then(function(){return sb('cases?client_id=eq.'+c.id,{method:'DELETE'});})
          .then(function(){return rows.k?sb('cases',{method:'POST',body:[rows.k]}):null;})
          .then(function(){return sb('notes?client_id=eq.'+c.id,{method:'DELETE'});})
          .then(function(){return rows.n.length?sb('notes',{method:'POST',body:rows.n}):null;})
          .then(function(){remote.last[c.id]=sig;});
      });
    });
    Object.keys(remote.last).forEach(function(id){
      if(!seen[id])jobs.push(function(){return sb('clients?id=eq.'+id,{method:'DELETE'}).then(function(){delete remote.last[id];});});
    });
    jobs.reduce(function(p,j){return p.then(j);},Promise.resolve()).then(function(){remote.state='ok';},function(){remote.state='err';})
      .then(function(){remote.busy=false;renderTop();if(remote.again)remotePush();});
  }
  function remoteSoon(){if(!remote.loaded)return;clearTimeout(remote.timer);remote.timer=setTimeout(remotePush,600);}

  function byId(id){return clients.filter(function(c){return c.id===id;})[0];}
  function first(c){var p=c.name.split(' ');return p[1]||p[0];}
  function stage(c){var k=c.cs;if(!k)return 'none';if(k.result)return 'closed';if(k.reqRecv&&!k.answered)return 'answer';if(k.answered)return 'decision';return 'wait';}
  function status(c){
    var s=stage(c),e=c.expiry?diff(c.expiry):null;
    if(s==='answer'){var d=diff(c.cs.reqDue);return {k:d<0?'crit':d<=10?'warn':'info',t:d<0?'Срок ответа прошёл':'Нужно ответить',f:'answer'};}
    if(s==='decision')return {k:'info',t:'Ждём решения',f:'wait'};
    if(s==='wait')return {k:'info',t:'Ждём ответа ведомства',f:'wait'};
    if(s==='closed')return {k:'good',t:'Решение: '+c.cs.result.text,f:'closed'};
    if(e!==null&&e<0)return {k:'crit',t:'Срок резиденции истёк',f:'renew'};
    if(e!==null&&e<=120)return {k:e<=45?'crit':'warn',t:'Пора подавать на продление',f:'renew'};
    return {k:'none',t:'Всё в порядке',f:'ok'};
  }
  function derived(c){
    var s=stage(c),e=c.expiry?diff(c.expiry):null;
    if(s==='answer')return {t:'Ответить на запрос до '+fmt(c.cs.reqDue),k:diff(c.cs.reqDue)<=3?'crit':'warn'};
    if(s==='wait')return {t:'Ждать ответа ведомства',k:'ok'};
    if(s==='decision')return {t:'Ждать решения',k:'ok'};
    if(s==='closed')return {t:c.cs.result.text==='Одобрено'?'Обновить срок резиденции':'Обсудить результат с клиентом',k:'warn'};
    if(e!==null&&e<=120)return {t:'Связаться с клиентом: готовим продление',k:e<=45?'crit':'warn'};
    return null;
  }
  function stepOf(c){if(c.next)return {t:c.next,k:'ok'};return derived(c)||{t:'нет шага',k:'none'};}
  function lastDate(c){var d=c.notes.length?c.notes[c.notes.length-1].date:(c.cs?c.cs.filed:null);return d;}

  function notes(){
    var out=[];
    clients.forEach(function(c){
      var s=stage(c),e=c.expiry?diff(c.expiry):null;
      if(s==='answer'){var d=diff(c.cs.reqDue);
        if(d<=10)out.push({id:c.id+'-req',cid:c.id,sev:d<0?'crit':d<=3?'warn':'info',left:d,kind:'internal',
          title:c.name+': ответить на запрос',
          text:(d<0?'Срок истёк '+days(-d)+' назад ('+fmt(c.cs.reqDue)+').':'Срок ответа '+fmt(c.cs.reqDue)+', осталось '+days(d)+'.')+' Дело №'+c.num+', '+c.cs.type.toLowerCase()+'.'});}
      if(!c.cs&&e!==null&&e<=120){
        var tier=e<0?'x':e<=30?'30':e<=60?'60':e<=90?'90':'120';
        var msg=e<0?'Здравствуйте, '+first(c)+'! Срок вашей резиденции истёк '+fmt(c.expiry)+'. Нужно срочно связаться и понять, что можно сделать. Напишите, когда удобно говорить.'
          :'Здравствуйте, '+first(c)+'! Ваша резиденция действует до '+fmt(c.expiry)+' (осталось '+days(e)+'). Пора готовить документы на продление. Напишите, когда удобно обсудить.';
        out.push({id:c.id+'-exp-'+tier,cid:c.id,sev:e<=30?'crit':e<=60?'warn':'info',left:e,kind:'client',
          title:c.name+': подходит срок резиденции',text:e<0?'Срок истёк '+days(-e)+' назад.':'Осталось '+days(e)+' (до '+fmt(c.expiry)+'). Подача на продление ещё не открыта.',msg:msg});}
    });
    out.sort(function(a,b){return a.left-b.left;});return out;
  }

  var FILTERS=[['all','Все'],['urgent','Срочные'],['answer','Ждут ответа'],['renew','Продление'],['work','В работе'],['closed','Закрытые']];
  function matches(c,f){
    var st=status(c),s=stage(c);
    if(f==='all')return true;
    if(f==='urgent')return st.k==='crit';
    if(f==='answer')return s==='answer';
    if(f==='renew')return st.f==='renew';
    if(f==='work')return s!=='none'&&s!=='closed';
    if(f==='closed')return st.f==='closed';
    return true;
  }

  }

  function lab(o){return o.ru+' ('+o.es+')';}

  function dlOpts(id,items){return '<datalist id="dl_'+id+'">'+items.map(function(x){return '<option value="'+esc(x)+'"></option>';}).join('')+'</datalist>';}
  var PH='Начните вводить…',NONE='— не выбрано';
  /* Поле со списком: печатаете, подсказки фильтруются. Для enum сохраняется код, свободный текст не принимается. */
  function comboF(id,label,list,cur,req,cls){
    var sel=list.filter(function(o){return o.v===cur;})[0];
    return '<label class="'+(cls||'')+'">'+label+'<input class="inl" id="'+id+'" data-enum="1" list="dl_'+id+'" value="'+esc(sel?lab(sel):'')+'" placeholder="'+PH+'" autocomplete="off">'+
      dlOpts(id,[NONE].concat(list.map(lab)))+(sel&&sel.note?'<span class="hint">'+esc(sel.note)+'</span>':'')+'</label>';
  }
  function suggF(id,label,items,val,cls,ph){
    return '<label class="'+(cls||'')+'">'+label+'<input class="inl" id="'+id+'" list="dl_'+id+'" value="'+esc(val)+'" placeholder="'+esc(ph||PH)+'" autocomplete="off">'+dlOpts(id,items)+'</label>';
  }
  function txtF(id,label,val,ph,cls){return '<label class="'+(cls||'')+'">'+label+'<input class="inl" id="'+id+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'"></label>';}
  function pick(list,txt){
    var t=(txt||'').trim().toLowerCase();if(!t)return null;
    var ex=list.filter(function(o){return lab(o).toLowerCase()===t||o.ru.toLowerCase()===t||o.es.toLowerCase()===t;});
    if(ex.length===1)return ex[0];
    var p=list.filter(function(o){return lab(o).toLowerCase().indexOf(t)===0;});
    return p.length===1?p[0]:null;
  }
  function nieCheck(v){
    v=(v||'').toUpperCase().replace(/[\s-]/g,'');if(!v)return '';
    var m=/^([XYZ])(\d{7})([A-Z])$/.exec(v);
    if(!m)return 'Формат NIE: буква X, Y или Z, 7 цифр и контрольная буква, например X1234567L.';
    var L='TRWAGMYFPDXBNJZSQVHLCKE'.charAt(+({X:'0',Y:'1',Z:'2'}[m[1]]+m[2])%23);
    return L===m[3]?'':'Контрольная буква не сходится: для этих цифр она должна быть '+L+'. Проверьте номер.';
  }
  function parseDMY(t){var m=/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec((t||'').trim());if(!m)return undefined;
    var d=new Date(+m[3],+m[2]-1,+m[1]);return d.getMonth()===+m[2]-1&&d.getDate()===+m[1]?iso(d):undefined;}
  function headHtml(c){

  function remindersHtml(c){
    var h='<h3 class="sec">Напоминания о сроке (Avisos de vencimiento)</h3>';
    if(!c.expiry)return h+'<div class="small-t">Укажите срок действия, и система сама рассчитает напоминания.</div>';
    var e=diff(c.expiry),cur=-1;[120,90,60,30].forEach(function(t,i){if(e<=t)cur=i;});
    h+='<table class="reminders-table"><thead><tr><th>Срок</th><th>Дата</th></tr></thead><tbody>'+[120,90,60,30].map(function(t,i){
      var d=iso(new Date(parse(c.expiry).getTime()-t*DAY)),past=diff(d)<0&&i!==cur;

    return h+'<div class="small-t" style="margin-top:6px">Напоминания клиенту создаются в эти даты, если дело продления не открыто.</div>';

        s==='wait'?'<div class="inline"><label>Дата запроса<input class="inl" type="date" id="rRecv" value="'+iso(TODAY)+'"></label><label>Ответить до<input class="inl" type="date" id="rDue" value="'+off(10)+'"></label><button class="btn small" data-act="req" type="button">Записать</button></div><div class="small-t" style="margin-top:4px">Запроса может не быть. Тогда сразу отметьте решение.</div>':'');
      h+=stp('Ответ на запрос отправлен',k.answered,!!k.answered,s==='answer',
        s==='answer'?'<div class="inline"><label>Дата ответа<input class="inl" type="date" id="aDate" value="'+iso(TODAY)+'"></label><button class="btn small" data-act="ans" type="button">Записать</button></div>':'');
      h+=stp('Решение получено'+(k.result?': '+k.result.text:''),k.result&&k.result.date,!!k.result,s==='decision'||s==='wait',
        !k.result&&(s==='decision'||s==='wait')?'<div class="inline"><label>Результат<select class="inl" id="dRes"><option>Одобрено</option><option>Отказ</option><option>Нужны дополнительные документы</option></select></label><label>Дата<input class="inl" type="date" id="dDate" value="'+iso(TODAY)+'"></label><button class="btn small" data-act="res" type="button">Записать</button></div>':'');
      h+='</ol>';
      if(k.result&&k.result.text==='Одобрено')h+='<div class="inline"><label>Новый срок резиденции<input class="inl" type="date" id="newExp" value="'+(c.expiry||'')+'"></label><button class="btn small" data-act="exp" type="button">Обновить срок и закрыть дело</button></div>';
    }
    h+='</div></div>';
    var rn=notes().filter(function(x){return x.cid===c.id&&x.kind==='client';})[0];
    if(rn){h+='<h3 class="sec">Напоминание клиенту</h3>'+feedCard(rn);}
    h+='<h3 class="sec">История и примечания</h3>';
    h+=c.notes.length?c.notes.map(function(n){return '<div class="card'+(n.t==='event'?' ev':'')+'"><div class="h"><span>'+(n.t==='event'?'Событие':'Примечание')+'</span><span>'+fmt(n.date)+'</span></div>'+esc(n.text)+'</div>';}).join(''):'<div class="small-t">Пока пусто. Пишите заметки внизу.</div>';
    $('main').innerHTML=h;
    $('composer').hidden=false;$('noteIn').value=c.draft||'';
    var m=$('main');m.scrollTop=m.scrollTop;
  }

  /* Right panel */
  function renderTop(){
    $('demoPill').hidden=!demo;
    var s=$('stat');
    if(remote.state==='ok'){s.className='stat';s.textContent=remote.busy?'Сохраняется в Supabase…':'Сохранено в Supabase'+(savedAt?', '+savedAt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'');}
    else if(remote.state==='err'){s.className='stat bad';s.textContent='Supabase недоступен: изменения только в этом браузере';}
    else if(storeOk){s.className='stat';s.textContent=savedAt?'Сохранено в этом браузере, '+savedAt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'Данные сохраняются в этом браузере';}
    else{s.className='stat bad';s.textContent='Не сохраняется: браузер блокирует хранилище. Делайте копии в файл';}
  }
  function render(){renderSeg();renderList();renderTabs();
    if(active==='today')renderToday();else renderClient(byId(active));
    save();renderTop();}
  function refreshAround(){renderList();renderTabs();}

  /* Events */
  function applyFilter(f){filter=f;renderSeg();renderList();if(active==='today')renderToday();}
  $('seg').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;applyFilter(b.getAttribute('data-f'));});
  $('main').addEventListener('click',function(e){var t=e.target.closest('[data-tf]');if(!t)return;var f=t.getAttribute('data-tf');applyFilter(filter===f?'all':f);});
  $('q').addEventListener('input',renderList);
  $('addBtn').addEventListener('click',function(){adding=true;renderList();});
  $('list').addEventListener('keydown',function(e){
    if(e.target.id!=='newName')return;
    if(e.key==='Escape'){adding=false;renderList();}
    if(e.key==='Enter'){var v=e.target.value.trim();if(!v)return;
      var c={id:nextId++,num:nextNum++,name:v,phone:'',expiry:null,cs:null,notes:[],next:'',draft:'',goal:'',nextNote:'',situ:'',tipo:'',estado:'',doc:'',otroDoc:'',nat:'',nie:'',phones2:[]};clients.push(c);adding=false;openTab(c.id);toast('Клиент добавлен');}
  });
  document.addEventListener('click',function(e){
    var o=e.target.closest('[data-open]');if(o){openTab(+o.getAttribute('data-open'));return;}
    var x=e.target.closest('[data-close]');if(x){var id=+x.getAttribute('data-close');tabs=tabs.filter(function(t){return t!==id;});if(active===id)active=tabs.length?tabs[tabs.length-1]:'today';render();return;}
    var t=e.target.closest('[data-tab]');if(t&&!e.target.closest('[data-close]')){var v=t.getAttribute('data-tab');active=v==='today'?'today':+v;render();return;}
    var sb=e.target.closest('[data-sent]');if(sb){var sid=sb.getAttribute('data-sent');sent[sid]=!sent[sid];render();return;}
    var cb=e.target.closest('[data-copy]');if(cb){var n=notes().filter(function(z){return z.id===cb.getAttribute('data-copy');})[0];
      try{navigator.clipboard.writeText(n.msg).then(function(){toast('Текст скопирован');},function(){toast('Не удалось скопировать');});}catch(err){toast('Не удалось скопировать');}return;}
    var a=e.target.closest('[data-act]');if(a&&typeof active==='number'){act(a.getAttribute('data-act'));}
  });
  document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tab')&&e.target.hasAttribute('tabindex')){active=+e.target.getAttribute('data-tab');render();}});
  function val(id){var el=$(id);return el?el.value:'';}
  function act(a){
    var c=byId(active);if(!c)return;
    if(a==='addphone'){c.phones2.push('');render();var el=$('fPh2_'+(c.phones2.length-1));if(el)el.focus();return;}
    if(a==='open'){c.cs={type:val('oType'),filed:val('oFiled')||iso(TODAY),reqRecv:null,reqDue:null,answered:null,result:null};ev(c,'Открыто дело: '+c.cs.type+', подано '+fmt(c.cs.filed)+'.');toast('Дело открыто');}
    if(a==='req'){if(!val('rRecv')||!val('rDue')){toast('Укажите обе даты');return;}c.cs.reqRecv=val('rRecv');c.cs.reqDue=val('rDue');ev(c,'Пришёл запрос ведомства. Ответить до '+fmt(c.cs.reqDue)+'.');toast('Запрос записан, напоминание создано');}
    if(a==='ans'){c.cs.answered=val('aDate')||iso(TODAY);ev(c,'Ответ на запрос отправлен '+fmt(c.cs.answered)+'.');toast('Ответ записан');}
    if(a==='res'){c.cs.result={text:val('dRes'),date:val('dDate')||iso(TODAY)};ev(c,'Решение: '+c.cs.result.text+'.');toast('Решение записано');}
    if(a==='exp'){if(val('newExp'))c.expiry=val('newExp');ev(c,'Срок резиденции обновлён: до '+fmt(c.expiry)+'. Дело закрыто.');c.cs=null;toast('Срок обновлён, дело закрыто');}
    render();
  }
  /* Браузер показывает в списке только варианты, подходящие к введённому тексту.
     Поэтому при входе в поле очищаем его (прежнее значение остаётся подсказкой) и возвращаем, если ничего не выбрано. */
  document.addEventListener('focusin',function(e){var t=e.target;
    if(t.dataset&&t.dataset.enum&&t.dataset.prev===undefined&&t.value){t.dataset.prev=t.value;t.placeholder=t.value;t.value='';}});
  document.addEventListener('focusout',function(e){var t=e.target;
    if(t.dataset&&t.dataset.enum&&t.dataset.prev!==undefined){if(t.value==='')t.value=t.dataset.prev;t.placeholder=PH;delete t.dataset.prev;}});
  document.addEventListener('change',function(e){
    var c=typeof active==='number'?byId(active):null;if(!c)return;
    var id=e.target.id;
    if(id==='cType'){c.cs.type=e.target.value;ev(c,'Тип дела изменён: '+c.cs.type+'.');render();}
    if(id==='nextIn'){c.next=e.target.value.trim();render();}
    if(id==='fName'&&e.target.value.trim()){c.name=e.target.value.trim();render();}
    if(id==='fPhone'){c.phone=e.target.value.trim();save();renderTop();}
    function setEnum(key,list){
      var t=e.target.value.trim();
      if(!t||t===NONE){c[key]='';}
      else{var o=pick(list,t);if(o)c[key]=o.v;else toast('Выберите вариант из списка');}
    }
    if(id==='fExp'){var t0=e.target.value.trim();if(!t0)c.expiry=null;else{var iv=parseDMY(t0);if(iv)c.expiry=iv;else toast('Дата в формате ДД.ММ.ГГГГ');}render();}
    if(id==='fSitu'){setEnum('situ',OPT.situ);if(c.tipo&&allowedTipo(c).every(function(o){return o.v!==c.tipo;}))c.tipo='';render();}
    if(id==='fTipo'){setEnum('tipo',allowedTipo(c));render();}
    if(id==='fEstado'){setEnum('estado',OPT.estado);render();}
    if(id==='fDoc'){setEnum('doc',OPT.doc);if(c.doc!=='otro')c.otroDoc='';render();}
    if(id==='fOtro'){c.otroDoc=e.target.value.trim();render();}
    if(id==='fGoal'){c.goal=e.target.value.trim();render();}
    if(id==='fNextNote'){c.nextNote=e.target.value.trim();render();}
    if(id==='fNat'){c.nat=e.target.value;render();}
    if(id==='fNie'){c.nie=e.target.value.toUpperCase().replace(/[\s-]/g,'');render();}
    if(/^fPh2_\d+$/.test(id)){var ix=+id.slice(5);c.phones2[ix]=e.target.value.trim();c.phones2=c.phones2.filter(function(p,i){return p||i!==ix;});render();}
  });
  $('noteIn').addEventListener('input',function(){var c=byId(active);if(c)c.draft=this.value;});
  function addNote(){var c=byId(active),v=$('noteIn').value.trim();if(!c||!v)return;c.notes.push({t:'note',text:v,date:iso(TODAY)});c.draft='';render();var m=$('main');m.scrollTop=m.scrollHeight;$('noteIn').focus();}
  $('noteBtn').addEventListener('click',addNote);
  $('noteIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addNote();}});

  $('expBtn').addEventListener('click',function(){
    try{var b=new Blob([snapshot()],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download='crm-rezidencii-'+iso(TODAY)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Копия сохранена в файл');}
    catch(e){toast('Не удалось сохранить файл');}
  });
  $('impBtn').addEventListener('click',function(){$('impFile').click();});
  $('impFile').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;var inp=this;
    var r=new FileReader();
    r.onload=function(){try{apply(JSON.parse(r.result));render();toast('Копия загружена: клиентов '+clients.length);}catch(e){toast('Файл не подходит: это не копия базы');}inp.value='';};
    r.readAsText(f);
  });
  var clrT=null;
  $('clrBtn').addEventListener('click',function(){
    var b=this;
    if(!clrT){b.textContent='Точно очистить?';clrT=setTimeout(function(){b.textContent='Очистить базу';clrT=null;},3500);return;}
    clearTimeout(clrT);clrT=null;b.textContent='Очистить базу';
    clients=[];sent={};nextNum=1001;nextId=1;demo=false;tabs=[];active='today';filter='all';render();toast('База очищена');
  });

  if(!load()){openTab(1);openTab(3);}
  active='today';render();
  remoteLoad().then(function(){tabs=[];active='today';render();},function(){remote.state='err';renderTop();});
})();
</script>
</body>
</html>
